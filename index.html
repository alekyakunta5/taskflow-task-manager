<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow | Task Manager</title><meta name="description" content="A lightweight browser-based task manager with filtering and persistence."><link rel="stylesheet" href="style.css"></head><body><header><nav><strong>TaskFlow</strong><a href="../devportfolio/index.html">Portfolio</a></nav><h1>Keep work moving.</h1><p class="muted">Your tasks are stored locally in this browser.</p></header><main><form id="form" class="toolbar"><input id="task" placeholder="What needs to be done?" aria-label="Task description" maxlength="120" required><select id="priority" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select><button>Add task</button></form><div class="toolbar"><label for="filter">Show:</label><select id="filter"><option value="all">All</option><option value="active">Active</option><option value="done">Completed</option></select><button id="clear" type="button">Clear completed</button></div><p id="count" aria-live="polite"></p><ul id="list" aria-label="Tasks"></ul></main><footer>Built with vanilla JavaScript · No account needed</footer><script src="app.js"></script></body></html>
